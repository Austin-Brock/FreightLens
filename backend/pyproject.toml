[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI puts Depends()/Query() in defaults on purpose
    "UP042", # the str/Enum fallback in models.enums is a deliberate 3.10 shim
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, not on tidy imports, and re-export fixtures.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
